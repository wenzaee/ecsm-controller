name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend-test:
    name: Backend tests and report
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      COVERAGE_THRESHOLD: "80"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Run unit tests and collect raw report
        id: tests
        shell: bash
        run: |
          set +e
          mkdir -p artifacts
          go test -json -coverprofile=artifacts/coverage.out ./... | tee artifacts/test-results.json
          test_exit_code=${PIPESTATUS[0]}
          echo "exit_code=$test_exit_code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Create coverage reports
        if: always()
        run: |
          if [ -f artifacts/coverage.out ]; then
            go tool cover -func=artifacts/coverage.out | tee artifacts/coverage.txt
            go tool cover -html=artifacts/coverage.out -o artifacts/coverage.html
          fi
          go run ./tools/testsummary \
            --input artifacts/test-results.json \
            --coverage artifacts/coverage.txt \
            --exit-code "${{ steps.tests.outputs.exit_code }}" \
            --output artifacts/test-summary.md
          cat artifacts/test-summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Check coverage threshold
        id: coverage
        if: always()
        shell: bash
        run: |
          coverage=""
          if [ -f artifacts/coverage.txt ]; then
            coverage=$(awk '/^total:/ { gsub("%", "", $3); print $3 }' artifacts/coverage.txt)
          fi

          if [ -n "$coverage" ] && awk "BEGIN { exit !($coverage >= $COVERAGE_THRESHOLD) }"; then
            echo "passed=true" >> "$GITHUB_OUTPUT"
            {
              echo "## 覆盖率质量门槛 ✅"
              echo "当前语句覆盖率为 **${coverage}%**，达到 **${COVERAGE_THRESHOLD}%** 的最低要求。"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "passed=false" >> "$GITHUB_OUTPUT"
            {
              echo "## 覆盖率质量门槛 ❌"
              echo "当前语句覆盖率为 **${coverage:-未生成}%**，低于 **${COVERAGE_THRESHOLD}%** 的最低要求。"
              echo "请补充未覆盖的业务分支与异常路径测试后重新提交。"
            } >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-report
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14
      - name: Mark workflow failed when tests fail
        if: always()
        shell: bash
        run: |
          if [ "${{ steps.tests.outputs.exit_code }}" != "0" ]; then
            exit "${{ steps.tests.outputs.exit_code }}"
          fi
          if [ "${{ steps.coverage.outputs.passed }}" != "true" ]; then
            exit 1
          fi

  build-package:
    name: Compile and package
    needs: backend-test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Compile binaries
        run: make build
      - name: Package binaries
        shell: bash
        run: |
          mkdir -p artifacts
          tar -czf artifacts/ecsm-controller-linux-amd64.tar.gz -C bin .
          sha256sum artifacts/ecsm-controller-linux-amd64.tar.gz > artifacts/SHA256SUMS
      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: ecsm-controller-linux-amd64
          path: artifacts/
          retention-days: 14
