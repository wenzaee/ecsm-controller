name: ECSM Controller CI

on:
  push:
    branches:
      - main
      - master

jobs:
  check:
    runs-on: go-latest

    steps:
      - name: Show Go version
        run: go version

      - name: Install git
        run: |
          apt-get update
          apt-get install -y git

      - name: Clone repository manually
        run: |
          git clone http://192.168.50.68:3000/wenza03/ecsm-controller.git repo
          cd repo
          git checkout main
          ls -lah

      - name: Configure Go proxy
        run: |
          go env -w GOPROXY=https://goproxy.cn,direct
          go env -w GOSUMDB=sum.golang.google.cn

      - name: Download dependencies
        run: |
          cd repo
          go mod download

      - name: Build project
        run: |
          cd repo
          go build ./...

      - name: Run go vet
        run: |
          cd repo
          go vet ./...
